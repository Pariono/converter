<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GitHub + Google Apps Script</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#1e40af);
}

.card{
    width:400px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    color:#111827;
    margin-bottom:10px;
}

p{
    color:#6b7280;
    margin-bottom:25px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

#hasil{
    margin-top:25px;
    background:#f3f4f6;
    padding:20px;
    border-radius:15px;
    text-align:left;
    min-height:120px;
    line-height:1.8;
}

.success{
    color:green;
}

.error{
    color:red;
}

.loading{
    text-align:center;
    color:#2563eb;
}

</style>
</head>
<body>

<div class="card">

    <h1>Google Apps Script API</h1>

    <p>GitHub Pages Terhubung Langsung ke GAS</p>

    <button onclick="ambilData()">
        Ambil Data
    </button>

    <div id="hasil">
        Menunggu data...
    </div>

</div>

<script>

async function ambilData(){

    const hasil = document.getElementById("hasil");

    hasil.innerHTML = `
        <div class="loading">
            Mengambil data...
        </div>
    `;

    // GANTI URL INI DENGAN WEB APP GOOGLE APPS SCRIPT KAMU
    const url = "https://script.google.com/macros/s/AKfycbxUuO2VRprhPuph85_cn2RdcN7gkpcsee1EqIePWsBXaow6w8ugPk5Skrs9xUz7BVw/exec";

    try {

        const response = await fetch(url);

        const data = await response.json();

        hasil.innerHTML = `
            <div class="success">
                ✔ Berhasil mengambil data
            </div>

            <hr><br>

            <b>Status :</b> ${data.status}<br>
            <b>Pesan :</b> ${data.message}<br>
            <b>Waktu :</b> ${data.waktu}
        `;

    } catch(error){

        hasil.innerHTML = `
            <div class="error">
                ❌ Gagal mengambil data dari GAS
            </div>
        `;

        console.log(error);
    }

}

</script>

</body>
</html>
