<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Link Google Apps Script</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .container h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #0f172a;
    }

    .container p {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      margin-bottom: 20px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f1f5f9;
      border-radius: 10px;
      word-break: break-all;
      display: none;
    }

    .result a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Google Apps Script Link</h1>
    <p>Upload dan tampilkan link Web App Google Apps Script</p>

    <label>Masukkan Link Google Apps Script</label>
    <input type="url" id="gasLink" placeholder="https://script.google.com/macros/s/AKfycbxUuO2VRprhPuph85_cn2RdcN7gkpcsee1EqIePWsBXaow6w8ugPk5Skrs9xUz7BVw/exec" />

    <button onclick="saveLink()">Upload Link</button>

    <div class="result" id="resultBox">
      <strong>Link Tersimpan:</strong><br><br>
      <a href="#" target="_blank" id="savedLink"></a>
    </div>

    <div class="footer">
      Dibuat untuk GitHub Pages + Google Apps Script
    </div>
  </div>

  <script>
    // Load data saat halaman dibuka
    window.onload = function() {
      const saved = localStorage.getItem('gas_link');

      if(saved) {
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('savedLink').href = saved;
        document.getElementById('savedLink').innerText = saved;
      }
    }

    // Simpan link
    function saveLink() {
      const link = document.getElementById('gasLink').value;

      if(link === '') {
        alert('Masukkan link terlebih dahulu!');
        return;
      }

      localStorage.setItem('gas_link', link);

      document.getElementById('resultBox').style.display = 'block';
      document.getElementById('savedLink').href = link;
      document.getElementById('savedLink').innerText = link;

      alert('Link berhasil disimpan!');
    }
  </script>

</body>
</html>
