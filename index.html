<!DOCTYPE html>
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0b5ed7;
    }

    #hasil {
      margin-top: 20px;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Google Apps Script API</h2>

    <button onclick="ambilData()">
      Ambil Data
    </button>

    <div id="hasil">
      Menunggu data...
    </div>
  </div>

  <script>
    async function ambilData() {

      // GANTI DENGAN URL WEB APP GAS
      const url = "https://script.google.com/macros/s/AKfycbxUuO2VRprhPuph85_cn2RdcN7gkpcsee1EqIePWsBXaow6w8ugPk5Skrs9xUz7BVw/exec";

      try {
        const response = await fetch(url);
        const data = await response.json();

        document.getElementById("hasil").innerHTML = `
          <b>Status:</b> ${data.status}<br>
          <b>Pesan:</b> ${data.message}<br>
          <b>Waktu:</b> ${data.waktu}
        `;

      } catch (error) {
        document.getElementById("hasil").innerHTML =
          "Gagal mengambil data";

        console.error(error);
      }
    }
  </script>

</body>
</html>
