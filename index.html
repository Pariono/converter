<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub + Google Apps Script</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f1f5f9;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      background:white;
      width:350px;
      padding:30px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
      text-align:center;
    }

    h2{
      margin-bottom:20px;
      color:#0f172a;
    }

    button{
      background:#2563eb;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
      transition:0.3s;
    }

    button:hover{
      background:#1d4ed8;
    }

    #hasil{
      margin-top:20px;
      background:#f8fafc;
      padding:15px;
      border-radius:10px;
      text-align:left;
      min-height:80px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Google Apps Script API</h2>

  <button onclick="ambilData()">
    Ambil Data
  </button>

  <div id="hasil">
    Menunggu data...
  </div>
</div>

<script>

async function ambilData(){

  // GANTI DENGAN LINK WEB APP GAS KAMU
  const url = "https://script.google.com/macros/s/AKfycbxUuO2VRprhPuph85_cn2RdcN7gkpcsee1EqIePWsBXaow6w8ugPk5Skrs9xUz7BVw/exec";

  try{

    const response = await fetch(url);
    const data = await response.json();

    document.getElementById("hasil").innerHTML = `
      <b>Status:</b> ${data.status}<br><br>
      <b>Pesan:</b> ${data.message}<br><br>
      <b>Waktu:</b> ${data.waktu}
    `;

  }catch(error){

    document.getElementById("hasil").innerHTML =
      "Gagal mengambil data!";

    console.log(error);
  }
}

</script>

</body>
</html>
