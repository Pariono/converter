<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAS Runner - Simple</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 1rem; }
        input, button { padding: 10px; font-size: 1rem; }
        input { width: 70%; }
        button { cursor: pointer; margin-left: 10px; }
        iframe { width: 100%; height: 500px; margin-top: 20px; border: 1px solid #ccc; }
        .note { background: #f0f0f0; padding: 10px; margin-top: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h2>🚀 Jalankan Google Apps Script Web App</h2>
    <div>
        <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/AKfycbxUuO2VRprhPuph85_cn2RdcN7gkpcsee1EqIePWsBXaow6w8ugPk5Skrs9xUz7BVw/exec" style="width: 70%;">
        <button id="runBtn">▶ Tampilkan</button>
        <button id="newTabBtn">🔗 Buka Tab Baru</button>
    </div>
    <iframe id="gasFrame" src="about:blank" title="Google Apps Script"></iframe>
    <div class="note">
        💡 <strong>Catatan:</strong> Jika Apps Script tidak bisa tampil di iframe (karena X-Frame-Options), gunakan tombol "Buka Tab Baru".<br>
        URL akan tersimpan otomatis di browser Anda.
    </div>

    <script>
        const STORAGE_KEY = 'gas_simple_url';
        const urlInput = document.getElementById('gasUrl');
        const iframe = document.getElementById('gasFrame');
        const runBtn = document.getElementById('runBtn');
        const newTabBtn = document.getElementById('newTabBtn');

        // load dari storage
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            urlInput.value = saved;
            // otomatis tampilkan jika ada URL
            if (saved.trim()) {
                iframe.src = saved;
            }
        }

        function saveUrl(url) {
            if (url) localStorage.setItem(STORAGE_KEY, url);
        }

        runBtn.addEventListener('click', () => {
            let url = urlInput.value.trim();
            if (!url) return alert('Masukkan URL Google Apps Script!');
            if (!url.startsWith('http')) url = 'https://' + url;
            iframe.src = url;
            saveUrl(url);
        });

        newTabBtn.addEventListener('click', () => {
            let url = urlInput.value.trim();
            if (!url) return alert('Masukkan URL dulu');
            if (!url.startsWith('http')) url = 'https://' + url;
            window.open(url, '_blank');
            saveUrl(url);
        });
    </script>
</body>
</html>
